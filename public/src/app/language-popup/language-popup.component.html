<div class="lp-backdrop" role="dialog" aria-modal="true" aria-labelledby="lp-title">
  <div class="lp-card" [class.lp-rtl]="isRtl">

    <div class="lp-icon-wrap" aria-hidden="true">
      <svg class="lp-globe" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
        <ellipse cx="24" cy="24" rx="9" ry="20" stroke="currentColor" stroke-width="2.5"/>
        <line x1="4" y1="24" x2="44" y2="24" stroke="currentColor" stroke-width="2.5"/>
        <line x1="7" y1="15" x2="41" y2="15" stroke="currentColor" stroke-width="2.5"/>
        <line x1="7" y1="33" x2="41" y2="33" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <span class="lp-pulse"></span>
    </div>

    <h2 class="lp-title" id="lp-title">{{ labels.headline }}</h2>

    <div class="lp-badge-group">
      <div class="lp-badge">
        <span class="lp-lang-dot"></span>
        <span class="lp-lang-name">{{ langName }}</span>
      </div>

      <div class="lp-source-badge" [class.lp-source-db]="source === 'db'">
        <i class="fas" [ngClass]="source === 'db' ? 'fa-user-circle' : 'fa-map-marker-alt'"></i>
        <span>{{ source === 'db' ? 'FROM PROFILE' : 'FROM LOCATION' }}</span>
      </div>
    </div>
    <p class="lp-subline">{{ sublineText }}</p>

    <p class="lp-eng-note">
      We detected your region as <strong>{{ countryName }}</strong>.<br>
      Language has been auto-set to <strong>{{ langName }}</strong>.
    </p>

    <div class="lp-actions">
      <button
        id="lp-btn-keep"
        class="lp-btn lp-btn-secondary"
        type="button"
        (click)="onKeep()">
        {{ labels.keepBtn }}
      </button>
      <button
        id="lp-btn-switch"
        class="lp-btn lp-btn-primary"
        type="button"
        (click)="onSwitch()">
        {{ labels.switchBtn }}
      </button>
    </div>

    <p class="lp-switch-hint">Switch to English</p>
  </div>
</div>
