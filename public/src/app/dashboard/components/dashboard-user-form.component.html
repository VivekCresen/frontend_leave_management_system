<section class="form-card">
  <div class="form-heading">
    <div>
      <h3>{{ formTitle }}</h3>
      <p>{{ formDescription }}</p>
    </div>
    <button
      type="button"
      class="close-button"
      (click)="cancelEdit()"
      aria-label="Close form"
      title="Close form">
      X
    </button>
  </div>

  <form #userForm="ngForm" class="user-form" (ngSubmit)="submit(userForm)">
    <label class="field">
      <span>Company ID</span>
      <input
        #companyId="ngModel"
        [(ngModel)]="model.companyId"
        maxlength="100"
        name="companyId"
        placeholder="Generated automatically"
        readonly
        type="text" />
     
    </label>

    <label class="field">
      <span>Full name</span>
      <input
        #fullName="ngModel"
        [(ngModel)]="model.fullName"
        [class.input-invalid]="isFieldInvalid(fullName, 'fullName', 'Full name is required')"
        (blur)="normalizeField('fullName')"
        maxlength="255"
        name="fullName"
        placeholder="Enter full name"
        required
        type="text" />
      <small
        [class.field-message-empty]="!getControlError(fullName, 'fullName', 'Full name is required')"
        aria-live="polite">
        {{ getControlError(fullName, 'fullName', 'Full name is required') || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Username</span>
      <input
        #username="ngModel"
        [(ngModel)]="model.username"
        [class.input-invalid]="isFieldInvalid(username, 'username', 'Username is required')"
        (blur)="normalizeField('username')"
        [maxlength]="usernameMaxLength"
        name="username"
        placeholder="Choose a username"
        required
        type="text" />
      <small
        [class.field-message-empty]="!getControlError(username, 'username', 'Username is required')"
        aria-live="polite">
        {{ getControlError(username, 'username', 'Username is required') || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Email</span>
      <input
        #email="ngModel"
        [(ngModel)]="model.email"
        [class.input-invalid]="isFieldInvalid(email, 'email', 'Email is required')"
        (blur)="normalizeField('email')"
        maxlength="200"
        name="email"
        placeholder="Enter email address"
        required
        type="email" />
      <small
        [class.field-message-empty]="!getControlError(email, 'email', 'Email is required')"
        aria-live="polite">
        {{ getControlError(email, 'email', 'Email is required') || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Password {{ isEditMode ? '(optional)' : '' }}</span>
      <div class="password-input-wrapper">
        <input
          #password="ngModel"
          [(ngModel)]="model.password"
          [class.input-invalid]="getPasswordError() !== null"
          [maxlength]="passwordMaxLength"
          [placeholder]="isEditMode ? 'Leave blank to keep current password' : 'Enter a strong password'"
          [required]="!isEditMode"
          [type]="showPassword ? 'text' : 'password'"
          [attr.autocomplete]="isEditMode ? 'new-password' : 'new-password'"
          name="password" />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [title]="showPassword ? 'Hide password' : 'Show password'">
          <i *ngIf="!showPassword" class="fas fa-eye"></i>
          <i *ngIf="showPassword" class="fas fa-eye-slash"></i>
        </button>
      </div>
      <small [class.field-message-empty]="!getPasswordError()" aria-live="polite">
        {{ getPasswordError() || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Role</span>
      <select
        #role="ngModel"
        [(ngModel)]="model.role"
        [class.input-invalid]="isFieldInvalid(role, 'role', 'Role is required')"
        [class.placeholder-selected]="!model.role"
        name="role"
        required>
        <option [ngValue]="''" disabled>Select a role</option>
        <option *ngFor="let roleName of assignableRoles" [ngValue]="roleName">
          {{ roleLabel(roleName) }}
        </option>
      </select>
      <small
        [class.field-message-empty]="!getControlError(role, 'role', 'Role is required')"
        aria-live="polite">
        {{ getControlError(role, 'role', 'Role is required') || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Gender</span>
      <select
        #gender="ngModel"
        [(ngModel)]="model.gender"
        [class.input-invalid]="isFieldInvalid(gender, 'gender', 'Gender is required')"
        [class.placeholder-selected]="!model.gender"
        name="gender"
        required>
        <option [ngValue]="''" disabled>Select gender</option>
        <option *ngFor="let option of genderOptions" [ngValue]="option">{{ option }}</option>
      </select>
      <small
        [class.field-message-empty]="!getControlError(gender, 'gender', 'Gender is required')"
        aria-live="polite">
        {{ getControlError(gender, 'gender', 'Gender is required') || ' ' }}
      </small>
    </label>

    <label class="field">
      <span>Status</span>
      <select
        #active="ngModel"
        [(ngModel)]="model.active"
        [class.input-invalid]="isFieldInvalid(active, 'active', 'Status is required')"
        [class.placeholder-selected]="model.active === null"
        name="active"
        required>
        <option [ngValue]="null" disabled>Select status</option>
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
      <small
        [class.field-message-empty]="!getControlError(active, 'active', 'Status is required')"
        aria-live="polite">
        {{ getControlError(active, 'active', 'Status is required') || ' ' }}
      </small>
    </label>

    <div class="form-actions">
      <button type="button" class="secondary-button" (click)="resetForm()" [disabled]="isSaving">
        Reset
      </button>
      <button type="submit" class="primary-button" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : isEditMode ? 'Update user' : 'Create user' }}
      </button>
    </div>
  </form>
</section>
