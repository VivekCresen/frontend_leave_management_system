<section class="stats-grid" [class.stats-grid-compact]="compact" aria-label="Dashboard summary">
  <article
    *ngFor="let card of cards"
    class="stat-card"
    [class.stat-card-link]="!!card.route"
    [class.tone-orange]="card.tone === 'orange'"
    [class.tone-slate]="card.tone === 'slate'">
    <a *ngIf="card.route; else staticCard" class="stat-card-anchor" [routerLink]="card.route" [queryParams]="card.queryParams ?? {}">
      <div class="stat-card-top">
        <p>{{ card.label }}</p>
      </div>
      <strong>{{ card.value }}</strong>
      <span>{{ card.note }}</span>
      <small class="stat-card-action">{{ card.actionLabel || 'Open' }}</small>
    </a>

    <ng-template #staticCard>
      <div class="stat-card-static">
        <div class="stat-card-top">
          <p>{{ card.label }}</p>
        </div>
        <strong>{{ card.value }}</strong>
        <span>{{ card.note }}</span>
      </div>
    </ng-template>
  </article>
</section>
