<section class="workspace">
  <header class="workspace-header">
    <div class="workspace-copy">
      <p class="workspace-eyebrow">{{ normalizedRole | titlecase }} dashboard</p>
      <h2>{{ pageHeading }}</h2>
      <p class="workspace-description">{{ pageDescription }}</p>
    </div>

    <div class="workspace-actions">
      <span class="badge badge-role">{{ normalizedRole }}</span>
      <span class="badge" [class.inactive]="!user.active">{{ user.active ? 'Active Account' : 'Inactive Account' }}</span>
      <button type="button" class="refresh-button" (click)="refresh()" [disabled]="isLoading || isSaving">
        {{ isLoading ? 'Refreshing...' : 'Refresh' }}
      </button>
    </div>
  </header>

  <section *ngIf="errorMessage" class="feedback-panel error-panel">
    <h3>Dashboard unavailable</h3>
    <p>{{ errorMessage }}</p>
  </section>

  <section *ngIf="isLoading" class="feedback-panel">
    <h3>Loading dashboard</h3>
    <p>Fetching the latest role-based data for this workspace.</p>
  </section>

  <ng-container *ngIf="!isLoading && !errorMessage">
    <app-admin-dashboard
      *ngIf="normalizedRole === 'ADMIN'"
      [dashboard]="dashboard"
      [editingUser]="editingUser"
      [fieldErrors]="fieldErrors"
      [isSaving]="isSaving"
      [isUserFormOpen]="isUserFormOpen"
      [pageId]="pageId"
      [user]="user"
      (cancelEditRequested)="cancelEdit()"
      (createRequested)="openCreateForm()"
      (deleteRequested)="handleDelete($event)"
      (editRequested)="startEdit($event)"
      (saveRequested)="handleSave($event)"></app-admin-dashboard>

    <app-manager-dashboard
      *ngIf="normalizedRole === 'MANAGER'"
      [dashboard]="dashboard"
      [editingUser]="editingUser"
      [fieldErrors]="fieldErrors"
      [isSaving]="isSaving"
      [isUserFormOpen]="isUserFormOpen"
      [pageId]="pageId"
      [user]="user"
      (cancelEditRequested)="cancelEdit()"
      (createRequested)="openCreateForm()"
      (deleteRequested)="handleDelete($event)"
      (editRequested)="startEdit($event)"
      (saveRequested)="handleSave($event)"></app-manager-dashboard>

    <app-employee-dashboard
      *ngIf="normalizedRole === 'EMPLOYEE'"
      [dashboard]="dashboard"
      [pageId]="pageId"
      [user]="user"></app-employee-dashboard>
  </ng-container>
</section>
